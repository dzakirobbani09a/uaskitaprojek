<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #12161c;
    --panel: #1b212b;
    --panel-line: #2a323e;
    --paper: #eff1ea;
    --paper-dim: #e3e6dc;
    --amber: #f5a623;
    --green: #1e9e5a;
    --green-deep: #167a44;
    --red: #e5484d;
    --muted: #6b7280;
    --muted-2: #939ba8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 26px);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--panel-line);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin: 0;
    color: var(--paper);
  }

  header nav a {
    color: var(--muted-2);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    margin-left: 22px;
    border-bottom: 2px solid transparent;
    padding-bottom: 2px;
    transition: color 0.15s, border-color 0.15s;
  }

  header nav a:hover { color: var(--amber); border-color: var(--amber); }

  .page {
    max-width: 960px;
    margin: 64px auto;
    padding: 0 20px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 8px 2px;
  }

  /* ===== TICKET ===== */
  .ticket {
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.04) inset;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.5s ease-out forwards;
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .ticket-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 28px 18px;
  }

  .ticket-head .code {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: 1px dashed var(--muted-2);
    border-radius: 999px;
    padding: 5px 12px;
  }
  .ticket-head .code:hover { border-color: var(--ink); color: var(--ink); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 8px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .status-pill::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .status-Menunggu { background: #fdf0da; color: #8a6300; }
  .status-Menunggu::before { background: var(--amber); }

  .status-Lunas { background: #dcf3e6; color: var(--green-deep); }
  .status-Lunas::before { background: var(--green); }

  .status-Dibatalkan { background: #fbe1e2; color: #a71d2a; }
  .status-Dibatalkan::before { background: var(--red); }

  /* perforation row with punch-holes */
  .perf {
    position: relative;
    height: 0;
    border-top: 2px dashed var(--paper-dim);
    margin: 0 0;
  }
  .perf::before, .perf::after {
    content: '';
    position: absolute;
    top: -9px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--ink);
  }
  .perf::before { left: -9px; }
  .perf::after { right: -9px; }

  .ticket-body {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
  }

  .details { padding: 22px 28px 8px; }
  .stub {
    padding: 24px 24px;
    text-align: center;
    border-left: 2px dashed var(--paper-dim);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 11px 0;
    border-bottom: 1px solid var(--paper-dim);
    font-size: 14.5px;
  }
  .row:last-child { border-bottom: none; }
  .row span:first-child { color: var(--muted); }
  .row b { text-align: right; font-weight: 600; }

  .stub .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stub img {
    width: 100%;
    max-width: 160px;
    border-radius: 4px;
    background: #fff;
    padding: 8px;
  }
  .stub .hint {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.4;
  }

  /* odometer total strip */
  .odometer {
    margin: 0 28px 22px;
    background: var(--ink);
    border-radius: 6px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .odometer .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted-2);
  }
  .odometer .amount {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 28px;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }

  .ticket-foot { padding: 0 28px 26px; }

  #payAlert .alert-error {
    background: #fbe1e2;
    color: #a71d2a;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 14px;
    border-left: 3px solid var(--red);
  }

  .btn-pay {
    width: 100%;
    padding: 16px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  .btn-pay:hover:not(:disabled) { background: var(--green-deep); }
  .btn-pay:active:not(:disabled) { transform: translateY(1px); }
  .btn-pay:disabled {
    background: var(--muted-2);
    cursor: not-allowed;
  }

  .disclaimer {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted-2);
    margin-top: 18px;
  }

  /* loading / error states, styled like a torn stub too */
  .state-box {
    max-width: 480px;
    margin: 120px auto;
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    padding: 34px 28px;
    text-align: center;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.55);
  }
  .state-box.error { border-left: 4px solid var(--red); }
  .state-box .spinner {
    width: 26px; height: 26px;
    border: 3px solid var(--paper-dim);
    border-top-color: var(--ink);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 760px) {
    .ticket-body { grid-template-columns: 1fr; }
    .stub { border-left: none; border-top: 2px dashed var(--paper-dim); }
    .perf::before, .perf::after { display: none; }
    .odometer { margin: 0 20px 20px; flex-direction: column; gap: 4px; align-items: flex-start; }
    .ticket-head, .details { padding-left: 20px; padding-right: 20px; }
    .ticket-foot { padding-left: 20px; padding-right: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticket { animation: none; opacity: 1; transform: none; }
    .state-box .spinner { animation: none; }
  }
</style>

</head>
<body>

<div class="page">

  <div id="loadingBox" class="state-box">
    <div class="spinner"></div>
    <p>Memuat data pembayaran...</p>
  </div>

  <div id="errorBox" class="state-box error" style="display:none;"></div>

  <div id="mainContainer" style="display:none;">
    <p class="eyebrow">Tiket Pembayaran</p>

    <div class="ticket">
      <div class="ticket-head">
        <button class="code" id="btnCopyCode" title="Klik untuk menyalin">#<span id="codeText">00000</span> ⧉</button>
        <span class="status-pill" id="statusPill">-</span>
      </div>

      <div class="perf"></div>

      <div class="ticket-body">
        <div class="details" id="summaryContainer"></div>

        <div class="stub">
          <p class="label">Scan QRIS</p>
          <img src="foto/download.png" alt="QRIS" onerror="this.style.display='none'">
          <p class="hint">Buka aplikasi e-wallet atau m-banking, lalu scan untuk membayar.</p>
        </div>
      </div>

      <div class="odometer">
        <span class="label">Total Bayar</span>
        <span class="amount" id="grandTotal">Rp0</span>
      </div>

      <div class="ticket-foot">
        <div id="payAlert"></div>
        <button id="btnBayar" class="btn-pay">Konfirmasi Pembayaran</button>
        <p class="disclaimer">Tekan tombol di atas setelah pembayaran QRIS berhasil kamu lakukan.</p>
      </div>
    </div>
  </div>

</div>

<script>
const API_BASE = 'https://uaskitaprojek-backend-production.up.railway.app/api';
const params = new URLSearchParams(window.location.search);
const rentalId = params.get('id');

let rental = null;

function fmtRupiah(n) {
    return 'Rp' + Number(n).toLocaleString('id-ID');
}

function fmtTanggal(d) {
    return new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}

function showError(msg) {
    document.getElementById('loadingBox').style.display = 'none';
    const box = document.getElementById('errorBox');
    box.style.display = 'block';
    box.innerHTML = `<strong>Tiket tidak bisa dimuat</strong><p style="color:var(--muted);font-size:14px;margin-top:8px;">${msg}</p>`;
}

// animasi angka naik ala odometer, murni visual, tidak mengubah data
function animateTotal(target) {
    const el = document.getElementById('grandTotal');
    const start = 0;
    const duration = 500;
    const startTime = performance.now();

    function tick(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const value = Math.round(start + (target - start) * progress);
        el.textContent = fmtRupiah(value);
        if (progress < 1) requestAnimationFrame(tick);
    }
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.textContent = fmtRupiah(target);
    } else {
        requestAnimationFrame(tick);
    }
}

async function loadRental() {
    if (!rentalId) {
        showError('ID rental tidak ditemukan di URL. Silakan booking ulang lewat form.html.');
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/rentals/${rentalId}`);
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Data rental tidak ditemukan.');

        rental = json.data;
        renderSummary();

        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'block';

        if (rental.status === 'Lunas') {
            const btn = document.getElementById('btnBayar');
            btn.textContent = 'Sudah Lunas';
            btn.disabled = true;
        }
    } catch (err) {
        showError(err.message);
    }
}

function renderSummary() {
    const days = Math.ceil((new Date(rental.end_date) - new Date(rental.start_date)) / 86400000) || 1;

    document.getElementById('codeText').textContent = String(rental.id).padStart(5, '0');
    document.getElementById('statusPill').outerHTML =
        `<span class="status-pill status-${rental.status}" id="statusPill">${rental.status}</span>`;

    document.getElementById('summaryContainer').innerHTML = `
        <div class="row"><span>Nama Penyewa</span><b>${rental.customer_name}</b></div>
        <div class="row"><span>No. WhatsApp</span><b>${rental.customer_phone}</b></div>
        <div class="row"><span>Kendaraan</span><b>${rental.vehicle ? rental.vehicle.name : '-'}</b></div>
        <div class="row"><span>Tanggal Sewa</span><b>${fmtTanggal(rental.start_date)} – ${fmtTanggal(rental.end_date)} (${days} hari)</b></div>
        <div class="row"><span>Dengan Sopir</span><b>${rental.with_driver ? 'Ya' : 'Tidak'}</b></div>
    `;

    animateTotal(rental.total_price);
}

document.getElementById('btnCopyCode').addEventListener('click', () => {
    const code = document.getElementById('codeText').textContent;
    navigator.clipboard?.writeText('#' + code);
    const btn = document.getElementById('btnCopyCode');
    const original = btn.innerHTML;
    btn.innerHTML = 'Disalin ✓';
    setTimeout(() => { btn.innerHTML = original; }, 1200);
});

document.getElementById('btnBayar').addEventListener('click', async () => {
    const btn = document.getElementById('btnBayar');
    const alertBox = document.getElementById('payAlert');
    alertBox.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    try {
        const res = await fetch(`${API_BASE}/rentals/${rentalId}/pay`, { method: 'PATCH' });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Gagal konfirmasi pembayaran.');

        rental = json.data;
        renderSummary();

        btn.textContent = 'Sudah Lunas';
        setTimeout(() => { window.location.href = 'riwayat.html'; }, 700);
    } catch (err) {
        alertBox.innerHTML = `<div class="alert-error">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Konfirmasi Pembayaran';
    }
});

loadRental();
</script>

</body>
</html>
